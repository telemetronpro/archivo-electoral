name: Sellos de tiempo

# Los sellos de OpenTimestamps quedan confirmados en Bitcoin unas horas después de
# crearlos. Una vez al día se pide la prueba completa y se guarda en el repositorio.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repositorio
  cancel-in-progress: false

jobs:
  sellos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python herramientas/archivar.py sellos
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piezas
          git diff --cached --quiet && exit 0
          git commit -q -m "Sellos de tiempo confirmados en Bitcoin"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
