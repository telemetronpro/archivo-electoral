name: Seguir cuentas

# Cada día guarda las publicaciones nuevas de las cuentas de cuentas.yaml.
on:
  schedule:
    - cron: "37 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repositorio
  cancel-in-progress: false

jobs:
  seguir:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements.txt
      - name: Seguir
        env:
          GH_TOKEN: ${{ github.token }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: python herramientas/archivar.py --resultado "$GITHUB_STEP_SUMMARY" seguir
      - name: Guardar en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piezas
          git diff --cached --quiet && exit 0
          git commit -q -m "Publicaciones nuevas de las cuentas seguidas"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
